<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>Маршрутный Лист</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Маршрутный Лист","short_name":"Маршруты","start_url":".","display":"standalone","background_color":"#f3f4f6","theme_color":"#4f46e5","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/713/713311.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --text-muted: #6b7280;
      --border: #e5e7eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
      --success-hover: #059669;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #eef2ff 0%, #f3f4f6 100%);
      color: var(--text);
      padding: 24px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Анимации */
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      border: 1px solid rgba(255, 255, 255, 0.8);
      animation: popIn 0.3s ease-out forwards;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Колоночная верстка формы */
    .form-columns {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    input, select {
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      background-color: #fafafa;
      transition: all 0.2s ease;
      width: 100%;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 22px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    .btn-print { background: var(--success); color: white; }
    .btn-print:hover { background: var(--success-hover); transform: translateY(-1px); }

    .btn-danger { 
      background: #fee2e2; 
      color: var(--danger); 
      padding: 6px 10px; 
      border-radius: 6px;
    }
    .btn-danger:hover { background: #fca5a5; }

    /* Таблица столбиками */
    .table-wrapper {
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-top: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      text-align: left;
    }

    th {
      background-color: #f9fafb;
      padding: 14px 16px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
      vertical-align: middle;
    }

    tbody tr {
      transition: background-color 0.15s ease;
      animation: slideDown 0.25s ease-out forwards;
    }

    tbody tr:hover {
      background-color: #f9fafb;
    }

    /* Бэджи категорий */
    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      background: #e0e7ff;
      color: #3730a3;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .zone-tag {
      font-weight: 700;
      color: var(--primary);
    }

    .print-header, .print-signature {
      display: none;
    }

    /* Адаптивность для мобильных */
    @media (max-width: 640px) {
      body { padding: 12px 6px; }
      .card { padding: 16px; }
      .form-columns { grid-template-columns: 1fr; }
      .btn-group { flex-direction: column; }
      button { width: 100%; }
    }

    /* Стили печати */
    @media print {
      body {
        background: white;
        color: black;
        padding: 0;
      }

      .no-print {
        display: none !important;
      }

      .card {
        box-shadow: none;
        border: none;
        padding: 0;
      }

      .print-header {
        display: block;
        margin-bottom: 20px;
        border-bottom: 2px solid #000;
        padding-bottom: 12px;
      }

      .print-info {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 10px;
      }

      table {
        border: 1px solid #000;
      }

      th, td {
        border: 1px solid #000;
        padding: 8px 10px;
        color: black;
      }

      th {
        background-color: #eee !important;
        -webkit-print-color-adjust: exact;
      }

      .badge {
        background: none;
        color: black;
        border: 1px solid #ccc;
        padding: 1px 4px;
      }

      .print-signature {
        margin-top: 40px;
        display: flex;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="card no-print">
      <h1>🚚 Информация о рейсе</h1>
      <div class="form-columns">
        <div class="form-group">
          <label for="driver">Водитель</label>
          <input type="text" id="driver" placeholder="Введите фамилию...">
        </div>
        <div class="form-group">
          <label for="date">Дата</label>
          <input type="date" id="date">
        </div>
      </div>
    </div>

    <div class="card no-print">
      <h1>📍 Добавить точку в маршрут</h1>
      <form onsubmit="event.preventDefault(); addOrUpdatePoint();">
        
        <div class="form-columns">
          <div class="form-group">
            <label for="routeZone">Маршрут / Зона</label>
            <select id="routeZone">
              <option value="Центр">Центр</option>
              <option value="2 Север">2 Север</option>
              <option value="2 Левых">2 Левых</option>
              <option value="Юго-Западный">Юго-Западный</option>
            </select>
          </div>

          <div class="form-group">
            <label for="pointAddress">Адрес / Наименование точки</label>
            <input type="text" id="pointAddress" placeholder="Магазин №15 / ул. Ленина 12">
          </div>

          <div class="form-group">
            <label for="productType">Категория товара</label>
            <select id="productType">
              <option value="Индейка">Индейка</option>
              <option value="Консервы">Консервы</option>
              <option value="Курица">Курица</option>
              <option value="Деликатесы">Деликатесы</option>
              <option value="Заморозка">Заморозка</option>
              <option value="Яйца">Яйца</option>
            </select>
          </div>

          <div class="form-group">
            <label for="waybillsCount">Кол-во накладных</label>
            <input type="number" id="waybillsCount" min="1" value="1">
          </div>
        </div>

        <div class="btn-group">
          <button type="submit" class="btn-primary">➕ Добавить / Объединить точку</button>
          <button type="button" class="btn-print" onclick="printPage()">🖨️ Печать / PDF</button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="print-header">
        <h1 style="text-align: center; margin-bottom: 10px; justify-content: center;">МАРШРУТНЫЙ ЛИСТ</h1>
        <div class="print-info">
          <span>Водитель: <span id="printDriverText">—</span></span>
          <span>Дата: <span id="printDateText">—</span></span>
        </div>
      </div>

      <h1 class="no-print" style="font-size: 1.2rem; margin-bottom: 12px;">Сформированный маршрут</h1>
      
      <div class="table-wrapper">
        <table id="routeTable">
          <thead>
            <tr>
              <th style="width: 45px;">№</th>
              <th style="width: 140px;">Маршрут</th>
              <th>Точка назначения</th>
              <th>Продукция в точке</th>
              <th style="width: 110px; text-align: center;">Накладных</th>
              <th class="no-print" style="width: 50px;"></th>
            </tr>
          </thead>
          <tbody id="pointsList"></tbody>
          <tfoot>
            <tr style="font-weight: bold; background-color: #f9fafb;">
              <td colspan="4" style="text-align: right; padding: 12px;">Всего накладных:</td>
              <td id="totalWaybills" style="text-align: center; font-size: 1.1rem; color: var(--primary);">0</td>
              <td class="no-print"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="print-signature">
        <div>Подпись водителя: __________________</div>
        <div>Сдал: __________________</div>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();
    let points = [];

    function updatePrintHeader() {
      const driver = document.getElementById('driver').value.trim() || '_________________';
      const dateVal = document.getElementById('date').value;
      
      let formattedDate = '_________________';
      if (dateVal) {
        const [year, month, day] = dateVal.split('-');
        formattedDate = `${day}.${month}.${year}`;
      }

      document.getElementById('printDriverText').textContent = driver;
      document.getElementById('printDateText').textContent = formattedDate;
    }

    function addOrUpdatePoint() {
      const zone = document.getElementById('routeZone').value;
      const addressInput = document.getElementById('pointAddress');
      const product = document.getElementById('productType').value;
      const waybillsInput = document.getElementById('waybillsCount');

      const address = addressInput.value.trim();
      const count = parseInt(waybillsInput.value, 10);

      if (!address) {
        alert('Укажите наименование или адрес точки.');
        return;
      }

      if (isNaN(count) || count < 1) {
        alert('Укажите корректное количество накладных.');
        return;
      }

      // Проверка на дубликаты (группировка по совпадению Зоны и Адреса)
      const existingPointIndex = points.findIndex(
        p => p.zone.toLowerCase() === zone.toLowerCase() && p.address.toLowerCase() === address.toLowerCase()
      );

      if (existingPointIndex !== -1) {
        // Если точка уже существует, увеличиваем число накладных
        points[existingPointIndex].count += count;
        // Добавляем категорию товара, если её ещё нет для этой точки
        if (!points[existingPointIndex].products.includes(product)) {
          points[existingPointIndex].products.push(product);
        }
      } else {
        // Создаём новую точку
        points.push({
          zone: zone,
          address: address,
          products: [product],
          count: count
        });
      }

      addressInput.value = '';
      waybillsInput.value = '1';
      addressInput.focus();

      renderPoints();
    }

    function removePoint(index) {
      points.splice(index, 1);
      renderPoints();
    }

    function renderPoints() {
      const tbody = document.getElementById('pointsList');
      tbody.innerHTML = '';
      let totalCount = 0;

      points.forEach((pt, idx) => {
        totalCount += pt.count;
        const tr = document.createElement('tr');
        
        const productsBadges = pt.products
          .map(p => `<span class="badge">${escapeHtml(p)}</span>`)
          .join(' ');

        tr.innerHTML = `
          <td><b>${idx + 1}</b></td>
          <td><span class="zone-tag">${escapeHtml(pt.zone)}</span></td>
          <td><b>${escapeHtml(pt.address)}</b></td>
          <td><div class="badge-container">${productsBadges}</div></td>
          <td style="text-align: center; font-weight: bold;">${pt.count}</td>
          <td class="no-print">
            <button type="button" class="btn-danger" onclick="removePoint(${idx})" title="Удалить точку">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalWaybills').textContent = totalCount;
      updatePrintHeader();
    }

    function printPage() {
      updatePrintHeader();
      window.print();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // Регистрация PWA Service Worker
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      try {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      } catch (e) {}
    }
  </script>
</body>
</html>
