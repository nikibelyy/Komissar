<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2563eb">
  <title>Маршрутный Лист</title>
  
  <link rel="manifest" href='data:application/manifest+json,{"name":"Маршрутный Лист","short_name":"Маршруты","start_url":".","display":"standalone","background_color":"#f8fafc","theme_color":"#2563eb","icons":[{"src":"https://cdn-icons-png.flaticon.com/512/713/713311.png","sizes":"512x512","type":"image/png"}]}'>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animated-card {
      animation: fadeIn 0.25s ease-out forwards;
    }

    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
    }

    h1, h2 {
      margin-bottom: 16px;
      color: #0f172a;
    }

    .grid-form {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 600;
      color: #475569;
    }

    input, select {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      background-color: #fff;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-primary { background: var(--primary); color: white; }
    .btn-print { background: #059669; color: white; }
    .btn-danger { background: #fee2e2; color: var(--danger); padding: 6px 12px; }

    .table-wrapper {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 0.95rem;
    }

    th {
      background-color: #f1f5f9;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .print-header, .print-signature {
      display: none;
    }

    /* Настройки печати */
    @media print {
      body {
        background: white;
        color: black;
        padding: 0;
      }

      .no-print {
        display: none !important;
      }

      .card {
        box-shadow: none;
        border: none;
        padding: 0;
      }

      .print-header {
        display: block;
        margin-bottom: 20px;
        border-bottom: 2px solid #000;
        padding-bottom: 10px;
      }

      .print-info {
        display: flex;
        justify-content: space-between;
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 10px;
      }

      table {
        border: 1px solid #000;
      }

      th, td {
        border: 1px solid #000;
        padding: 8px;
        color: black;
      }

      th {
        background-color: #eee !important;
        -webkit-print-color-adjust: exact;
      }

      .print-signature {
        margin-top: 40px;
        display: flex;
        justify-content: space-between;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="card animated-card no-print">
      <h1>Маршрутизатор</h1>
      
      <div class="grid-form">
        <div class="form-group">
          <label for="driver">Фамилия водителя</label>
          <input type="text" id="driver" placeholder="Иванов И.И.">
        </div>
        <div class="form-group">
          <label for="date">Дата</label>
          <input type="date" id="date">
        </div>
      </div>

      <hr style="margin: 16px 0; border: none; border-top: 1px solid var(--border);">

      <h2>Добавить точку в маршрут</h2>
      <form onsubmit="event.preventDefault(); addPoint();" class="grid-form">
        
        <div class="form-group">
          <label for="routeZone">Маршрут / Зона</label>
          <select id="routeZone">
            <option value="Центр">Центр</option>
            <option value="2 Север">2 Север</option>
            <option value="2 Левых">2 Левых</option>
            <option value="Юго-Западный">Юго-Западный</option>
          </select>
        </div>

        <div class="form-group">
          <label for="productType">Товар / Продукция</label>
          <select id="productType">
            <option value="Индейка">Индейка</option>
            <option value="Консервы">Консервы</option>
            <option value="Курица">Курица</option>
            <option value="Деликатесы">Деликатесы</option>
            <option value="Заморозка">Заморозка</option>
            <option value="Яйца">Яйца</option>
          </select>
        </div>

        <div class="form-group">
          <label for="pointAddress">Адрес / Точка</label>
          <input type="text" id="pointAddress" placeholder="Магазин №5 / ул. Ленина 10">
        </div>

        <div class="form-group">
          <label for="waybillsCount">Накладных (шт)</label>
          <input type="number" id="waybillsCount" min="1" value="1">
        </div>

        <div class="btn-group" style="grid-column: 1 / -1; margin-top: 8px;">
          <button type="submit" class="btn-primary">+ Добавить в лист</button>
          <button type="button" class="btn-print" onclick="printPage()">🖨️ Печать / Сохранить PDF</button>
        </div>
      </form>
    </div>

    <div class="card animated-card">
      <div class="print-header">
        <h1 style="text-align: center; margin-bottom: 10px;">МАРШРУТНЫЙ ЛИСТ</h1>
        <div class="print-info">
          <span>Водитель: <span id="printDriverText">—</span></span>
          <span>Дата: <span id="printDateText">—</span></span>
        </div>
      </div>

      <h2>Маршрутные точки</h2>
      
      <div class="table-wrapper">
        <table id="routeTable">
          <thead>
            <tr>
              <th style="width: 40px;">№</th>
              <th>Маршрут</th>
              <th>Продукция</th>
              <th>Точка назначения</th>
              <th style="width: 100px; text-align: center;">Накладных</th>
              <th class="no-print" style="width: 60px;"></th>
            </tr>
          </thead>
          <tbody id="pointsList"></tbody>
          <tfoot>
            <tr style="font-weight: bold; background-color: #f8fafc;">
              <td colspan="4" style="text-align: right;">Итого накладных:</td>
              <td id="totalWaybills" style="text-align: center;">0</td>
              <td class="no-print"></td>
            </tr>
          </tfoot>
        </table>
      </div>

      <div class="print-signature">
        <div>Подпись водителя: __________________</div>
        <div>Сдал: __________________</div>
      </div>
    </div>

  </div>

  <script>
    document.getElementById('date').valueAsDate = new Date();
    let points = [];

    function updatePrintHeader() {
      const driver = document.getElementById('driver').value.trim() || '_________________';
      const dateVal = document.getElementById('date').value;
      
      let formattedDate = '_________________';
      if (dateVal) {
        const [year, month, day] = dateVal.split('-');
        formattedDate = `${day}.${month}.${year}`;
      }

      document.getElementById('printDriverText').textContent = driver;
      document.getElementById('printDateText').textContent = formattedDate;
    }

    function addPoint() {
      const zone = document.getElementById('routeZone').value;
      const product = document.getElementById('productType').value;
      const addressInput = document.getElementById('pointAddress');
      const waybillsInput = document.getElementById('waybillsCount');

      const address = addressInput.value.trim();
      const count = parseInt(waybillsInput.value, 10);

      if (!address) {
        alert('Укажите адрес или название точки.');
        return;
      }

      if (isNaN(count) || count < 1) {
        alert('Укажите корректное количество накладных.');
        return;
      }

      points.push({ zone, product, address, count });
      addressInput.value = '';
      waybillsInput.value = '1';
      addressInput.focus();

      renderPoints();
    }

    function removePoint(index) {
      points.splice(index, 1);
      renderPoints();
    }

    function renderPoints() {
      const tbody = document.getElementById('pointsList');
      tbody.innerHTML = '';
      let totalCount = 0;

      points.forEach((pt, idx) => {
        totalCount += pt.count;
        const tr = document.createElement('tr');
        tr.className = 'animated-card';
        tr.innerHTML = `
          <td>${idx + 1}</td>
          <td><b>${escapeHtml(pt.zone)}</b></td>
          <td>${escapeHtml(pt.product)}</td>
          <td>${escapeHtml(pt.address)}</td>
          <td style="text-align: center;">${pt.count}</td>
          <td class="no-print">
            <button type="button" class="btn-danger" onclick="removePoint(${idx})">✕</button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('totalWaybills').textContent = totalCount;
      updatePrintHeader();
    }

    function printPage() {
      updatePrintHeader();
      window.print();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // PWA Service Worker
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      try {
        const swCode = `
          self.addEventListener('install', e => self.skipWaiting());
          self.addEventListener('activate', e => self.clients.claim());
          self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => caches.match(e.request))));
        `;
        const blob = new Blob([swCode], { type: 'application/javascript' });
        navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
      } catch (e) {}
    }
  </script>
</body>
</html>
